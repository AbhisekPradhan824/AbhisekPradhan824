name: Dynamic GitHub Stats

on:
  schedule:
    - cron: "0 */6 * * *"  # Every 6 hours
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Job 1: Generate Profile Summary Cards
  profile-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fez6k/github-profile-summary-cards@release
        with:
          USERNAME: AbhisekPradhan824
          BRANCH_NAME: main
          UTC_OFFSET: 5.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 2: Cache-bust external images
  update-readme:
    runs-on: ubuntu-latest
    needs: profile-summary
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # Pull latest after profile-summary commits

      - name: Pull latest changes
        run: git pull origin main

      - name: Update cache-busting parameters
        run: |
          TIMESTAMP=$(date +%s)
          # Update activity graph
          sed -i -E "s|(github-readme-activity-graph.vercel.app/graph\?username=AbhisekPradhan824[^\"]*?)(&v=[0-9]*)?(\")|\\1\&v=${TIMESTAMP}\\3|g" README.md

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --staged --quiet || git commit -m "🔄 Auto-update stats $(date +'%Y-%m-%d %H:%M')"
          git push
